# trend_following.yaml - Strategy Config: Trend Following (Stage 5)
# Expected win rate benchmark: 35-45% (Chỉ dùng đối chiếu nghiên cứu, không overfit)

strategy:
  name: "TREND_FOLLOWING"
  enabled: true
  timeframe_signal: "4h"        # Khung tín hiệu chính (closed 4h candles)
  timeframe_execution: "15m"     # Khung thực thi (next-open 15m)

# Conviction tier & Sizing mặc định (Risk Manager / PaperBroker)
default_conviction: "normal"     # 2% base risk per trade
leverage: 2.0                    # Đòn bẩy (<= 5.0x max_leverage)
base_risk_percent: 0.02          # 2% rủi ro tài khoản

# Quy tắc Trend Following Causal Rulebook (Section 4.2 & 4.3)
rules:
  crossover_fast_ema: 20
  crossover_slow_ema: 50
  regime_ema: 200
  rsi_period: 14
  rsi_threshold: 50.0            # RSI > 50 for LONG, RSI < 50 for SHORT
  max_setup_age_bars: 12         # Tối đa 12 nến 4h sau trigger để hoàn tất pullback
  swing_lookback_bars: 5         # Số nến 4h đã đóng gần nhất để tìm Swing Low/High

# Cấu hình OI Confluence (ADR 0005)
oi_confluence:
  mode: "optional"              # "strict" | "optional" | "disabled"
  fallback_when_nan: true
  nan_log_note: "OI_BYPASSED_HISTORICAL"

# Cắt lỗ & Trailing Stop (Section 4.3)
stop_loss:
  method: "swing_causal"         # Đáy swing gần nhất (LONG) hoặc đỉnh swing gần nhất (SHORT)
  trailing_method: "ema50_tightening_only" # Bám EMA50 nến 4h đóng theo hướng thắt chặt một chiều

# Chốt lời: Giai đoạn 5 KHÔNG dùng take-profit cố định hoặc partial TP
take_profit:
  enabled: false                 # take_profit_price = None
