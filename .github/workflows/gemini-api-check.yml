name: Gemini API connection check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Gemini secret and JSON inference
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const key = process.env.GEMINI_API_KEY;
          if (!key) throw Error('Missing GEMINI_API_KEY');
          const model = 'gemini-3-flash-preview';
          const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
            method: 'POST',
            headers: {'Content-Type':'application/json','x-goog-api-key':key},
            body: JSON.stringify({contents:[{parts:[{text:'Return JSON only: {"ok":true}'}]}],generationConfig:{responseMimeType:'application/json',maxOutputTokens:256}}),
            signal: AbortSignal.timeout(60000)
          });
          if (!r.ok) { console.error('Gemini HTTP '+r.status+'; no fallback attempted'); process.exit(1); }
          const data = await r.json(), c = data.candidates?.[0];
          if (c?.finishReason !== 'STOP') throw Error('Incomplete or blocked response');
          const text = c.content.parts.filter(p=>!p.thought).map(p=>p.text??'').join('');
          if (JSON.parse(text).ok !== true) throw Error('JSON verification failed');
          console.log('VERIFIED: Gemini structured inference; model='+model);
          console.log('No paper ledger or trading action was accessed. Billing tier is not established by this check.');
          JS
      - name: Offline transport and paper checks
        run: node --test scripts/cloud-transport.test.mjs scripts/render-transport.integration.test.mjs scripts/gemini-paper*.test.mjs paper-bot-studio/*.test.mjs
      - name: Verify isolated paper cycle on Render (not original wallets)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAPER_VALIDATION: 'true'
          PAPER_DATA_DIR: cloud-validation
        run: |
          node scripts/render-cycle.mjs
      - name: Isolated validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloud-validation
          path: |
            cloud-validation/state.json
            cloud-validation/state-view.json
            cloud-validation/decisions/*.json
            cloud-validation/contexts/*.json
          retention-days: 7

