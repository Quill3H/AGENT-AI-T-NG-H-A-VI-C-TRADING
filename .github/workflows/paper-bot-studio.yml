name: OKX Paper Bot Studio (Gemini + Kronos)
on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
permissions:
  contents: write
concurrency:
  group: paper-bot-studio-okx-state
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline checks
        run: node --test scripts/cloud-transport.test.mjs scripts/render-transport.integration.test.mjs scripts/gemini-paper*.test.mjs scripts/kronos-advisory.test.mjs scripts/prepare-kronos.test.mjs paper-bot-studio/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-kronos.txt
      - name: Install pinned CPU inference dependencies
        continue-on-error: true
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r scripts/requirements-kronos.txt
      - name: Check Kronos input validation
        run: python scripts/test_kronos_forecast.py
      - name: Load pinned Kronos source
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: shiyu-coder/Kronos
          ref: 67b630e67f6a18c9e9be918d9b4337c960db1e9a
          path: .kronos/source
          persist-credentials: false
      - name: Restore pinned model weights
        uses: actions/cache@v4
        with:
          path: .kronos/models
          key: kronos-small-901c26c-tokenizer-0e01173-v1
      - name: Require explicit free-tier model and key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo 'Missing GEMINI_API_KEY secret'; exit 1; }
          test -n "$GEMINI_MODEL" || { echo 'Missing GEMINI_MODEL variable'; exit 1; }
      - name: Load existing OKX ledger (never reset wallets)
        uses: actions/checkout@v4
        with:
          ref: paper-state-okx
          path: paper-state
      - name: Run Gemini paper cycle on Render
        id: cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAPER_DATA_DIR: paper-state
          KRONOS_FORECAST_PATH: .kronos/forecast.json
          HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
        run: |
          node scripts/prepare-kronos.mjs
          timeout --signal=TERM --kill-after=30s 9m node scripts/render-cycle.mjs
      - name: Preserve ledger even after partial cycle failure
        if: ${{ always() && steps.cycle.outcome != 'skipped' && steps.cycle.outcome != '' }}
        run: |
          test -f paper-state/.cloud-ready || { echo 'No complete authenticated response; committed ledger remains authoritative'; exit 1; }
          test -f paper-state/state.json
          git -C paper-state config user.name 'paper-bot-studio[bot]'
          git -C paper-state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C paper-state add -- state.json
          if test -d paper-state/decisions; then git -C paper-state add -- decisions; fi
          if test -d paper-state/contexts; then git -C paper-state add -- contexts; fi
          if test -f paper-state/state-view.json; then git -C paper-state add -- state-view.json; fi
          if ! git -C paper-state diff --cached --quiet; then
            git -C paper-state commit -m 'chore: persist paper ledger'
            git -C paper-state push origin HEAD:paper-state-okx
          fi
      - name: Preserve recovery evidence without worker credentials
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: paper-cycle-evidence
          path: |
            paper-state/state.json
            paper-state/contexts/*.json
            paper-state/decisions/*.json
            .kronos/input.json
            .kronos/forecast.json
          retention-days: 7
